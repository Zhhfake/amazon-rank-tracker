name: Amazon Rank Tracker 18

on:
  schedule:
    # Try several off-peak minutes; the script exits early if the sheet was updated recently.
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

concurrency:
  group: amazon-rank-tracker-18
  cancel-in-progress: false

jobs:
  run-rank-tracker-18:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_PRIVATE_OPEN_ID: ${{ secrets.FEISHU_PRIVATE_OPEN_ID }}
      SPREADSHEET_18_TOKEN: ${{ secrets.SPREADSHEET_18_TOKEN }}
      SPREADSHEET_18_URL: ${{ secrets.SPREADSHEET_18_URL }}
      FEISHU_18_WEBHOOK: ${{ secrets.FEISHU_18_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run tracker 18
        run: python -u run_18_rank_tracker.py --skip-if-recent 55
