name: Amazon Rank Tracker

on:
  schedule:
    # Beijing time 11:00, 13:00, 15:00, 17:00, 19:00.
    - cron: "0 3,5,7,9,11 * * *"
  workflow_dispatch:

concurrency:
  group: amazon-rank-tracker
  cancel-in-progress: false

jobs:
  run-rank-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_PRIVATE_OPEN_ID: ${{ secrets.FEISHU_PRIVATE_OPEN_ID }}
      SPREADSHEET_TOKEN: ${{ secrets.SPREADSHEET_TOKEN }}
      SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run tracker
        run: python -u rank_tracker_core.py --notify private
