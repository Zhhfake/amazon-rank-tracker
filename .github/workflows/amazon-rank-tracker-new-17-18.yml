name: Amazon Rank Tracker New 18P 17P

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

concurrency:
  group: amazon-rank-tracker-new-17-18
  cancel-in-progress: false

jobs:
  run-rank-tracker-new-17-18:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      NEW_FEISHU_APP_ID: ${{ secrets.NEW_FEISHU_APP_ID }}
      NEW_FEISHU_APP_SECRET: ${{ secrets.NEW_FEISHU_APP_SECRET }}
      FEISHU_PRIVATE_OPEN_ID: ${{ secrets.FEISHU_PRIVATE_OPEN_ID }}
      SPREADSHEET_NEW_TOKEN: ${{ secrets.SPREADSHEET_NEW_TOKEN }}
      SPREADSHEET_NEW_URL: ${{ secrets.SPREADSHEET_NEW_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check new tracker secrets
        run: |
          test -n "$NEW_FEISHU_APP_ID" || { echo "Missing NEW_FEISHU_APP_ID"; exit 1; }
          test -n "$NEW_FEISHU_APP_SECRET" || { echo "Missing NEW_FEISHU_APP_SECRET"; exit 1; }
          test -n "$SPREADSHEET_NEW_TOKEN" || { echo "Missing SPREADSHEET_NEW_TOKEN"; exit 1; }
          test -n "$SPREADSHEET_NEW_URL" || { echo "Missing SPREADSHEET_NEW_URL"; exit 1; }

      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run new 18P 17P tracker
        run: python -u run_new_17_18_rank_tracker.py --skip-if-recent 55
